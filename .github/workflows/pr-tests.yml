name: PR validation
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  unit:
    name: Typecheck, build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
